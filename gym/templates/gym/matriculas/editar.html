{% extends "gym/base.html" %}

{% block title %}
    Editar Matrícula - PowerOn
{% endblock %}

{% block content %}

<div class="home">

    <div class="page-header">

        <div>
            <h1>EDITAR MATRÍCULA</h1>

            <p>
                Atualize os dados da matrícula.
            </p>
        </div>

    </div>


    {% if erro %}

        <div class="mensagem mensagem-erro">
            {{ erro }}
        </div>

    {% endif %}


    <div class="card">

        <form method="post">

            {% csrf_token %}


            <div class="form-group">

                <label for="codigo_matr">
                    Código da matrícula
                </label>

                <input
                    type="number"
                    id="codigo_matr"
                    value="{{ matricula.codigo_matr }}"
                    disabled
                >

            </div>


            <div class="form-group">

                <label for="cod_aluno">
                    Aluno
                </label>

                <select
                    id="cod_aluno"
                    name="cod_aluno"
                    required
                >

                    {% for aluno in alunos %}

                        <option
                            value="{{ aluno.codigo }}"
                            {% if aluno.codigo == matricula.cod_aluno %}
                                selected
                            {% endif %}
                        >
                            {{ aluno.codigo }} - {{ aluno.nome }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="cod_modalidade">
                    Modalidade
                </label>

                <select
                    id="cod_modalidade"
                    name="cod_modalidade"
                    required
                >

                    {% for modalidade in modalidades %}

                        <option
                            value="{{ modalidade.codigo_modalidade }}"
                            {% if modalidade.codigo_modalidade == matricula.cod_modalidade %}
                                selected
                            {% endif %}
                        >
                            {{ modalidade.codigo_modalidade }} - {{ modalidade.descricao }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label for="qtde_aulas">
                    Quantidade de aulas
                </label>

                <input
                    type="number"
                    id="qtde_aulas"
                    name="qtde_aulas"
                    min="1"
                    value="{{ matricula.qtde_aulas }}"
                    required
                >

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn"
                >
                    Salvar alterações
                </button>

                <a
                    href="{% url 'gym:matriculas_detalhes' matricula.codigo_matr %}"
                    class="btn btn-verde"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </div>


    <div class="form-actions">

        <a
            href="{% url 'gym:matriculas_lista' %}"
            class="btn btn-verde"
        >
            ← Voltar para matrículas
        </a>

    </div>

</div>

{% endblock %}
