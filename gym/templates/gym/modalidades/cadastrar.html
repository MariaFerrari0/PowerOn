{% extends "gym/base.html" %}

{% block title %}
    Cadastrar Modalidade - PowerOn
{% endblock %}

{% block content %}

<h1>CADASTRAR MODALIDADE</h1>

{% if erro %}
    <p>{{ erro }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label for="codigo_modalidade">
        Código:
    </label>

    <input
        type="number"
        id="codigo_modalidade"
        name="codigo_modalidade"
        min="1"
        required
    >

    <label for="descricao">
        Descrição:
    </label>

    <input
        type="text"
        id="descricao"
        name="descricao"
        required
    >

    <label for="cod_prof">
        Professor:
    </label>

    <select
        id="cod_prof"
        name="cod_prof"
        required
    >
        <option value="">
            Selecione um professor
        </option>

        {% for professor in professores %}
            <option value="{{ professor.codigo_prof }}">
                {{ professor.codigo_prof }} - {{ professor.nome }}
            </option>
        {% endfor %}
    </select>

    <label for="valor_aula">
        Valor da aula:
    </label>

    <input
        type="number"
        id="valor_aula"
        name="valor_aula"
        step="0.01"
        min="0.01"
        required
    >

    <label for="limite_alunos">
        Limite de alunos:
    </label>

    <input
        type="number"
        id="limite_alunos"
        name="limite_alunos"
        min="1"
        required
    >

    <button type="submit">
        Cadastrar
    </button>
</form>

<a href="{% url 'gym:modalidades_lista' %}">
    Voltar para modalidades
</a>

{% endblock %}
