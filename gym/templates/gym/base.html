{% load static %}

<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="PowerOn - Sistema de Gestão para Academia"
    >

    <title>
        {% block title %}PowerOn{% endblock %}
    </title>


    <!-- CSS GLOBAL -->

    <link
        rel="stylesheet"
        href="{% static 'gym/css/global.css' %}"
    >


    <!-- COMPONENTES -->

    <link
        rel="stylesheet"
        href="{% static 'gym/css/components.css' %}"
    >


    <!-- PÁGINAS -->

    <link
        rel="stylesheet"
        href="{% static 'gym/css/pages.css' %}"
    >


    <!-- RESPONSIVIDADE -->

    <link
        rel="stylesheet"
        href="{% static 'gym/css/responsive.css' %}"
    >


    {% block extra_css %}
    {% endblock %}

</head>


<body>


    <!-- BOTÃO DO MENU MOBILE -->

    <button
        type="button"
        class="menu-mobile"
        id="menu-mobile"
        aria-label="Abrir menu"
        aria-expanded="false"
    >
        ☰
    </button>


    <!-- FUNDO ESCURO DO MENU MOBILE -->

    <div
        class="sidebar-overlay"
        id="sidebar-overlay"
    >
    </div>


    <!-- SIDEBAR -->

    {% include "gym/components/sidebar.html" %}


    <!-- CONTEÚDO PRINCIPAL -->

    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>


    <!-- JAVASCRIPT PRINCIPAL -->

    <script
        src="{% static 'gym/js/main.js' %}"
    ></script>


    {% block extra_js %}
    {% endblock %}


</body>

</html>
