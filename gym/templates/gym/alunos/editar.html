{% extends "gym/base.html" %}

{% block title %}
    Editar Aluno - PowerOn
{% endblock %}

{% block content %}

<div class="home">

    <div class="page-header">

        <div>

            <h1>EDITAR ALUNO</h1>

            <p>
                Atualize os dados cadastrais do aluno.
            </p>

        </div>

    </div>


    {% if erro %}

        <div class="mensagem mensagem-erro">
            {{ erro }}
        </div>

    {% endif %}


    <div class="card">

        <form method="post">

            {% csrf_token %}


            <div class="form-group">

                <label for="codigo">
                    Código
                </label>

                <input
                    type="number"
                    id="codigo"
                    value="{{ aluno.codigo }}"
                    disabled
                >

            </div>


            <div class="form-group">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ aluno.nome }}"
                    required
                    placeholder="Digite o nome completo"
                >

            </div>


            <div class="form-group">

                <label for="data_nascimento">
                    Data de nascimento
                </label>

                <input
                    type="date"
                    id="data_nascimento"
                    name="data_nascimento"
                    value="{{ aluno.data_nascimento }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="peso">
                    Peso (kg)
                </label>

                <input
                    type="number"
                    id="peso"
                    name="peso"
                    step="0.01"
                    min="0.01"
                    value="{{ aluno.peso }}"
                    required
                    placeholder="Ex.: 65.5"
                >

            </div>


            <div class="form-group">

                <label for="altura">
                    Altura (m)
                </label>

                <input
                    type="number"
                    id="altura"
                    name="altura"
                    step="0.01"
                    min="0.01"
                    value="{{ aluno.altura }}"
                    required
                    placeholder="Ex.: 1.65"
                >

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn"
                >
                    Salvar alterações
                </button>


                <a
                    href="{% url 'gym:alunos_detalhes' aluno.codigo %}"
                    class="btn btn-verde"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </div>


    <div class="form-actions">

        <a
            href="{% url 'gym:alunos_lista' %}"
            class="btn btn-verde"
        >
            ← Voltar para alunos
        </a>

    </div>

</div>

{% endblock %}
