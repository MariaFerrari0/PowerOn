{% extends "gym/base.html" %}

{% block title %}
    Editar Aluno - PowerOn
{% endblock %}

{% block content %}

<h1>Editar Aluno</h1>

{% if erro %}
<p>{{ erro }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label for="codigo">Código:</label>
    <input
        type="number"
        id="codigo"
        value="{{ aluno.codigo }}"
        disabled
    >

    <label for="nome">Nome:</label>
    <input
        type="text"
        id="nome"
        name="nome"
        value="{{ aluno.nome }}"
        required
    >

    <label for="data_nascimento">
        Data de nascimento:
    </label>

    <input
        type="date"
        id="data_nascimento"
        name="data_nascimento"
        value="{{ aluno.data_nascimento }}"
        required
    >

    <label for="peso">Peso:</label>
    <input
        type="number"
        id="peso"
        name="peso"
        step="0.01"
        min="0.01"
        value="{{ aluno.peso }}"
        required
    >

    <label for="altura">Altura:</label>
    <input
        type="number"
        id="altura"
        name="altura"
        step="0.01"
        min="0.01"
        value="{{ aluno.altura }}"
        required
    >

    <button type="submit">
        Salvar alterações
    </button>
</form>

<a href="{% url 'gym:alunos_detalhes' aluno.codigo %}">
    Cancelar
</a>

{% endblock %}
