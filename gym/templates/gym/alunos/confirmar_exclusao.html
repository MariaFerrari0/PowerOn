{% extends "gym/base.html" %}

{% block title %}
    Excluir Aluno - PowerOn
{% endblock %}

{% block content %}

<div class="home">

    <div class="page-header">

        <div>

            <h1>EXCLUIR ALUNO</h1>

            <p>
                Confirme a exclusão do aluno.
            </p>

        </div>

    </div>


    <div class="detalhes-card">

        <div class="mensagem mensagem-aviso">

            <strong>
                Atenção!
            </strong>

            <p>
                Tem certeza que deseja excluir este aluno?
            </p>

        </div>


        <div class="detalhes-item">

            <strong>
                Código
            </strong>

            <span>
                {{ aluno.codigo }}
            </span>

        </div>


        <div class="detalhes-item">

            <strong>
                Nome
            </strong>

            <span>
                {{ aluno.nome }}
            </span>

        </div>


        <div class="form-actions">

            <form method="post">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-perigo"
                    data-confirmar="Tem certeza que deseja excluir este aluno?"
                >
                    Confirmar exclusão
                </button>

            </form>


            <a
                href="{% url 'gym:alunos_detalhes' aluno.codigo %}"
                class="btn btn-verde"
            >
                Cancelar
            </a>

        </div>

    </div>

</div>

{% endblock %}
