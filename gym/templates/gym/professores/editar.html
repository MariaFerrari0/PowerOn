{% extends "gym/base.html" %}

{% block title %}
    Editar Professor - PowerOn
{% endblock %}

{% block content %}

<h1>EDITAR PROFESSOR</h1>

{% if erro %}
    <p>{{ erro }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label for="codigo_prof">
        Código:
    </label>

    <input
        type="number"
        id="codigo_prof"
        value="{{ professor.codigo_prof }}"
        disabled
    >

    <label for="nome">
        Nome:
    </label>

    <input
        type="text"
        id="nome"
        name="nome"
        value="{{ professor.nome }}"
        required
    >

    <label for="endereco">
        Endereço:
    </label>

    <input
        type="text"
        id="endereco"
        name="endereco"
        value="{{ professor.endereco }}"
        required
    >

    <label for="telefone">
        Telefone:
    </label>

    <input
        type="text"
        id="telefone"
        name="telefone"
        value="{{ professor.telefone }}"
        required
    >

    <button type="submit">
        Salvar alterações
    </button>
</form>

<a href="{% url 'gym:professores_detalhes' professor.codigo_prof %}">
    Cancelar
</a>

{% endblock %}
