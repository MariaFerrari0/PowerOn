{% extends "gym/base.html" %}

{% block title %}
    Cadastrar Professor - PowerOn
{% endblock %}

{% block content %}

<h1>CADASTRAR PROFESSOR</h1>

{% if erro %}
    <p>{{ erro }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label for="codigo_prof">
        Código:
    </label>

    <input
        type="number"
        id="codigo_prof"
        name="codigo_prof"
        min="1"
        required
    >

    <label for="nome">
        Nome:
    </label>

    <input
        type="text"
        id="nome"
        name="nome"
        required
    >

    <label for="endereco">
        Endereço:
    </label>

    <input
        type="text"
        id="endereco"
        name="endereco"
        required
    >

    <label for="telefone">
        Telefone:
    </label>

    <input
        type="text"
        id="telefone"
        name="telefone"
        required
    >

    <button type="submit">
        Cadastrar
    </button>
</form>

<a href="{% url 'gym:professores_lista' %}">
    Voltar para professores
</a>

{% endblock %}
