{% extends "gym/base.html" %}

{% block title %}
    Cadastrar Professor - PowerOn
{% endblock %}

{% block content %}

<div class="home">

    <div class="page-header">

        <div>

            <h1>CADASTRAR PROFESSOR</h1>

            <p>
                Cadastre um novo professor na academia.
            </p>

        </div>

    </div>


    {% if erro %}

        <div class="mensagem mensagem-erro">
            {{ erro }}
        </div>

    {% endif %}


    <div class="card">

        <form method="post">

            {% csrf_token %}


            <div class="form-group">

                <label for="codigo_prof">
                    Código
                </label>

                <input
                    type="number"
                    id="codigo_prof"
                    name="codigo_prof"
                    min="1"
                    required
                    placeholder="Digite o código do professor"
                >

            </div>


            <div class="form-group">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                    placeholder="Digite o nome completo"
                >

            </div>


            <div class="form-group">

                <label for="endereco">
                    Endereço
                </label>

                <input
                    type="text"
                    id="endereco"
                    name="endereco"
                    required
                    placeholder="Digite o endereço"
                >

            </div>


            <div class="form-group">

                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="text"
                    id="telefone"
                    name="telefone"
                    required
                    placeholder="Digite o telefone"
                >

            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn"
                >
                    Cadastrar professor
                </button>


                <a
                    href="{% url 'gym:professores_lista' %}"
                    class="btn btn-verde"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
